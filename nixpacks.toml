# Nixpacks config — Capone Dashboard API
#
# Node 20 é pego automaticamente via .node-version.
# Sem isto abaixo, o Nixpacks usa `corepack` pra ativar pnpm — e corepack 24+
# tem bug conhecido com pnpm 11 (ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING).
# Solução: forçar pnpm 9 (LTS estável) sem passar por corepack.

[phases.setup]
nixPkgs = ["nodejs-20_x", "pnpm"]

[variables]
NIXPACKS_PNPM_VERSION = "9"
